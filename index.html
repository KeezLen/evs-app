// ---- js/screens/tour.js ----
/**
 * The in-app guided tour.
 *
 * The tenant lands on the working app straight away; Watt then speaks from a
 * bubble anchored to each part of the screen in turn. This replaces the old
 * full-screen introduction, which put six pages of reading in front of an app
 * nobody had seen yet.
 *
 * The app underneath stays visible and is never covered, only dimmed, so the
 * thing being described is always in view.
 */


const TOUR_LABELS = {
  next: { nl: 'Verder', en: 'Next' },
  done: { nl: 'Ik snap het', en: 'Got it' },
  skip: { nl: 'Sla uitleg over', en: 'Skip the tour' },
  counter: { nl: '{n} van {total}', en: '{n} of {total}' },
};
const tourLabel = (key, lang) => TOUR_LABELS[key][lang] || TOUR_LABELS[key].nl;

/** Places the bubble near its anchor, keeping it fully on screen. */
function position(bubble, anchorEl, stage) {
  const pad = 12;
  const box = stage.getBoundingClientRect();

  if (!anchorEl) {
    bubble.style.top = (box.height / 2 - bubble.offsetHeight / 2) + 'px';
    bubble.style.left = pad + 'px';
    return;
  }

  const a = anchorEl.getBoundingClientRect();
  const below = a.bottom - box.top + pad;
  const above = a.top - box.top - bubble.offsetHeight - pad;
  // Prefer below the anchor; flip above when there is not enough room.
  const top = below + bubble.offsetHeight < box.height ? below : Math.max(pad, above);
  bubble.style.top = top + 'px';
  bubble.style.left = pad + 'px';
}

/** Draws a ring around the element being described. */
function highlight(ring, anchorEl, stage) {
  if (!anchorEl) { ring.style.display = 'none'; return; }
  const box = stage.getBoundingClientRect();
  const a = anchorEl.getBoundingClientRect();
  ring.style.display = 'block';
  ring.style.top = (a.top - box.top - 6) + 'px';
  ring.style.left = (a.left - box.left - 6) + 'px';
  ring.style.width = (a.width + 12) + 'px';
  ring.style.height = (a.height + 12) + 'px';
}

/**
 * Runs the tour inside `stage` (the phone frame).
 * `onDone` fires whether the tenant finishes or skips - skipping is not a
 * failure state and must never be treated as one.
 */
function mountTour(stage, lang, onDone, controls = {}) {
  const { onScreen } = controls;
  let index = 0;
  let shownScreen = null;

  const layer = document.createElement('div');
  layer.className = 'tour-layer';
  layer.innerHTML = '<div class="tour-dim"></div><div class="tour-ring"></div>'
    + '<div class="tour-bubble" role="dialog" aria-live="polite"></div>';
  stage.appendChild(layer);

  const ring = layer.querySelector('.tour-ring');
  const bubble = layer.querySelector('.tour-bubble');

  function finish() {
    layer.remove();
    // Never leave someone stranded on whichever tab they skipped from.
    if (onScreen && shownScreen !== 'home') onScreen('home');
    onDone();
  }

  function draw() {
    const step = tourStep(index);
    const isLast = index === TOTAL_TOUR_STEPS - 1;

    // Open the screen this step is about, before measuring anything on it.
    // The tour layer hangs off the phone rather than the screen, so switching
    // tabs underneath it does not disturb the bubble.
    if (onScreen && step.screen && step.screen !== shownScreen) {
      onScreen(step.screen);
      shownScreen = step.screen;
    }
    const counter = tourLabel('counter', lang)
      .replace('{n}', index + 1).replace('{total}', TOTAL_TOUR_STEPS);

    bubble.innerHTML =
      '<div class="tour-watt">' + batterySvg(index === 0 ? 'happy' : 'thinking') + '</div>'
      + '<div class="tour-speech">'
      + '<p class="tour-title">' + step[lang].title + '</p>'
      + '<p class="tour-body">' + step[lang].body + '</p>'
      + '<div class="tour-actions">'
      + '<button class="btn" data-tour="next">' + (isLast ? tourLabel('done', lang) : tourLabel('next', lang)) + '</button>'
      + '</div>'
      + '<button class="tour-skip" data-tour="skip">' + tourLabel('skip', lang) + '</button>'
      + '<p class="tour-counter">' + counter + '</p>'
      + '</div>';

    const anchorEl = step.anchor ? stage.querySelector(step.anchor) : null;
    highlight(ring, anchorEl, stage);
    position(bubble, anchorEl, stage);
  }

  layer.addEventListener('click', (event) => {
    const action = event.target.closest('[data-tour]')?.dataset.tour;
    if (!action) return;
    if (action === 'skip') { finish(); return; }
    if (index >= TOTAL_TOUR_STEPS - 1) { finish(); return; }
    index += 1;
    draw();
  });

  draw();
  return { close: finish, name: ASSISTANT_NAME };
}

// ---- js/main.js ----
/**
 * Application bootstrap and tab router.
 *
 * Composes the engine over the simulated history, then renders whichever tab
 * is active. First open goes through Watt's introduction instead, which is
 * also the only place consent is given.
 */














function boot(profileId) {
  // The model learns from the baseline window and is measured only on the
  // report window after it. Fitting and measuring the same days would force
  // the net saving to exactly zero. See BASELINE_DAYS in engine/model.js.
  const { baseline, report } = splitBaseline(generateHistory(profileId));
  const model = fitModel(baseline);
  const expectedSeries = report.map((r) => expectedFor(model, r));

  const cumulative = treeProgress(expectedSeries, report);
  // Per-day net, kept so the notification and tip history can report what each
  // day actually did rather than repeating the running total.
  const netByDay = report.map((r, i) => netSaving(expectedSeries[i], r));
  const rawNet = netByDay.reduce((sum, n) => sum + n, 0);
  const floorDays = report.filter(
    (r, i) => isBelowComfortFloor(expectedSeries[i].gas_m3, r.gas_m3)
  ).length;

  return {
    model, readings: report, expectedSeries, cumulative, rawNet, netByDay, floorDays,
    units: cumulativeUnits(expectedSeries, report),
    stage: stageFor(cumulative), progress: progressToNext(cumulative),
    health: treeHealth(
      report.map((r, i) => ({
        net: netSaving(expectedSeries[i], r),
        belowFloor: isBelowComfortFloor(expectedSeries[i].gas_m3, r.gas_m3),
      })),
      shieldsEarned(stageFor(cumulative).level)
    ),
  };
}

/**
 * Left drawer, opened from the hamburger. The demonstrator brief specifies a
 * drawer rather than the bottom tab bar Report 6 originally designed.
 *
 * Every entry keeps its text label - no icon-only navigation for a 50+ group
 * with limited digital confidence.
 */
function tabBar(activeId, lang) {
  // A detail screen keeps its parent lit, so the bar never goes blank
  // underneath you.
  const parent = BOTTOM_TABS.includes(activeId) ? activeId : 'profile';

  return '<nav class="tabbar" aria-label="' + (lang === 'en' ? 'Main' : 'Hoofdmenu') + '">'
    + BOTTOM_TABS.map((id) => {
      const tab = TABS.find((t) => t.id === id);
      const on = id === parent;
      return '<button class="tab' + (on ? ' active' : '') + '" data-tab="' + id + '"'
        + (on ? ' aria-current="page"' : '') + '>'
        + '<span class="tab-icon" aria-hidden="true">' + tab.icon + '</span>'
        + '<span class="tab-label">' + (tab[lang] || tab.nl) + '</span></button>';
    }).join('')
    + '</nav>';
}

/**
 * Watt's own words about the screen you are on, behind a small button in the
 * header.
 *
 * The introduction runs once and can be skipped. Someone who skipped it, or
 * sat through it and is still unsure on one screen, needs the explanation for
 * that screen and nothing else - which is what helpFor() returns. It is the
 * same copy the tour uses, never a paraphrase that could drift from it.
 */
function infoSheet(screenId, title, lang) {
  const steps = helpFor(screenId);
  const items = steps.length
    ? steps.map((step) =>
        '<div class="sheet-item"><strong>' + step[lang].title + '</strong>'
        + '<p>' + step[lang].body + '</p></div>').join('')
    : '<p>' + say('Hier valt weinig uit te leggen.', 'There is little to explain here.', lang) + '</p>';

  return '<div class="sheet-scrim" data-close="info"></div>'
    + '<aside class="sheet" role="dialog" aria-modal="true" aria-label="'
    + say('Uitleg over ', 'About ', lang) + title + '">'
    + '<div class="sheet-head">'
    + '<div class="sheet-watt" aria-hidden="true">' + batterySvg('happy') + '</div>'
    + '<h3>' + say('Wat staat hier?', 'What is on this screen?', lang) + '</h3>'
    + '<button class="sheet-close" data-close="info" aria-label="'
    + say('Sluiten', 'Close', lang) + '">&times;</button></div>'
    + items + '</aside>';
}

/**
 * NL/EN, in the header rather than only under Profile.
 *
 * Dutch is the product language, but the demonstrator is also read by DACS and
 * examiners, and the first screen anyone sees is the consent journey - which
 * sits in front of the Profile screen where the other toggle lives. Without
 * this, an English reader has no way out of Dutch until registration is done.
 */
function languageSwitch(lang) {
  return '<div class="lang-switch">'
    + '<button class="chip' + (lang === 'nl' ? ' on' : '') + '" data-lang="nl"'
    + ' aria-label="Nederlands"' + (lang === 'nl' ? ' aria-current="true"' : '') + '>NL</button>'
    + '<button class="chip' + (lang === 'en' ? ' on' : '') + '" data-lang="en"'
    + ' aria-label="English"' + (lang === 'en' ? ' aria-current="true"' : '') + '>EN</button>'
    + '</div>';
}

function header(title, lang) {
  return '<span class="header-title">' + title + '</span>'
    + languageSwitch(lang)
    + '<button class="info-button" data-open="info" aria-label="'
    + say('Uitleg over dit scherm', 'About this screen', lang) + '">i</button>';
}

/** The header before the app proper takes over: no drawer to open yet. */
function accessHeader(lang) {
  return '<span class="header-title brand">' + BRAND.name + '</span>' + languageSwitch(lang);
}

function footerNote(app, lang) {
  const last = app.readings.at(-1).date;
  return '<p class="illustrative">'
    + (lang === 'en'
      ? 'Last reading ' + last + ' &mdash; data runs one day behind. All amounts are example values; there is no real P4 data yet.'
      : 'Laatste meting ' + last + ' &mdash; gegevens lopen een dag achter. Alle bedragen zijn voorbeeldwaarden; er is nog geen echte P4-data.')
    + '</p>';
}

/**
 * Mounts the phone app.
 *
 * `store` is the single source of truth for state, shared with the access
 * screens: the NL/EN switch in the header, the one on the Profile screen and
 * the language question on the first onboarding step must never disagree, so
 * none of them owns a copy.
 *
 * @param {object} store  { get(): state, set(next): void }
 */
function start(getApp, store) {
  const phone = document.getElementById('phone');
  const screen = document.getElementById('screen');
  const nav = document.getElementById('nav');
  const tabs = document.getElementById('tabs');
  const bar = document.getElementById('header');
  let active = 'home';
  let infoOpen = false;

  function effectiveSeason() {
    const state = store.get();
    if (state.season !== 'auto') return state.season;
    // 'auto' follows the calendar of the simulated demo date.
    const month = Number(getApp().readings.at(-1).date.slice(5, 7));
    if (month === 12) return 'christmas';
    if (month >= 6 && month <= 8) return 'summer';
    return null;
  }

  /**
   * Re-renders the active screen.
   *
   * Scroll position is kept unless the screen itself changed: ticking a
   * consent box or renaming the tree re-renders the whole screen, and jumping
   * back to the top each time would lose the reader's place mid-list.
   */
  function draw(resetScroll = false) {
    const state = store.get();
    const app = getApp();
    const offset = screen.scrollTop;
    // Larger text is a real setting, not a label: Report 6 validated 20px as
    // the default, and this is the way up from it for anyone who needs it.
    phone.dataset.large = state.largeText === true ? 'true' : 'false';
    app.season = effectiveSeason();
    const tab = TABS.find((t) => t.id === active);
    const title = tab[state.language] || tab.nl;
    bar.innerHTML = header(title, state.language);
    screen.innerHTML = tab.render(app, state, state.language) + footerNote(app, state.language);
    // Outside #screen, so the bar stays put while the content scrolls.
    tabs.innerHTML = tabBar(active, state.language);
    nav.innerHTML = infoOpen ? infoSheet(active, title, state.language) : '';
    screen.scrollTop = resetScroll ? 0 : offset;
  }

  function go(id) { active = id; infoOpen = false; draw(true); }

  phone.addEventListener('click', (event) => {
    if (event.target.closest('[data-open="info"]')) { infoOpen = true; draw(); return; }
    if (event.target.closest('[data-close="info"]')) { infoOpen = false; draw(); return; }

    // Watt, on demand. His steps are anchored to elements on the home screen,
    // so go there first - replaying from Profile would point at nothing.
    if (event.target.closest('[data-replay-tour]')) {
      if (phone.querySelector('.tour-layer')) return;
      go('home');
      mountTour(phone, store.get().language,
        () => store.set({ ...store.get(), tourDone: true }), { onScreen: go });
      return;
    }

    const tab = event.target.closest('[data-tab]')?.dataset.tab;
    if (tab) { go(tab); return; }

    // Cards and links open their detail screen.
    const open = event.target.closest('[data-open]')?.dataset.open;
    if (open && open !== 'info') go(open);
  });

  // Consent can be withdrawn from Profile at any time, and the app keeps
  // working afterwards (handover Q10).
  screen.addEventListener('change', (event) => {
    const key = event.target.dataset?.consent;
    if (!key) return;
    store.set(setConsent(store.get(), key, event.target.checked));
  });

  screen.addEventListener('click', (event) => {
    const lang = event.target.closest('[data-lang]')?.dataset.lang;
    if (lang) { store.set({ ...store.get(), language: lang }); return; }

    const name = event.target.closest('[data-name]')?.dataset.name;
    if (name) { store.set({ ...store.get(), treeName: name }); return; }

    const season = event.target.closest('[data-season]')?.dataset.season;
    if (season) { store.set({ ...store.get(), season }); return; }

    const period = event.target.closest('[data-period]')?.dataset.period;
    if (period) { store.set({ ...store.get(), period }); return; }

    const filter = event.target.closest('[data-challenge]')?.dataset.challenge;
    if (filter) store.set({ ...store.get(), challengeFilter: filter });
    // [data-open] is handled by the phone listener above, which this bubbles to.
  });

  screen.addEventListener('change', (event) => {
    const setting = event.target.dataset?.setting;
    if (!setting) return;
    store.set({ ...store.get(), [setting]: event.target.checked });
  });

  // Free-text renaming, alongside the tappable suggestions: the tree-mascot
  // report asks for both, because typing is more effortful for this group.
  screen.addEventListener('change', (event) => {
    if (!('nameInput' in (event.target.dataset || {}))) return;
    const value = event.target.value.trim();
    if (!value) return;
    store.set({ ...store.get(), treeName: value });
  });

  draw(true);
  return { draw, go };
}

document.addEventListener('DOMContentLoaded', () => {
  const screen = document.getElementById('screen');
  try {
    let state = load(window.localStorage);
    // Read through a getter downstream, so the household the demo runs on can
    // be swapped without re-registering a single listener.
    const app = boot(state.profile);
    let appView = null;
    let accessView = null;
    const headerBar = document.getElementById('header');

    const store = {
      get: () => state,
      set: (next) => {
        state = next;
        save(window.localStorage, state);
        // Before registration finishes there is no appView, and the access
        // screens own the phone. Either way something must redraw, or the
        // language switch would change nothing on screen.
        if (appView) appView.draw();
        else { headerBar.innerHTML = accessHeader(state.language); accessView?.redraw(); }
      },
    };

    // On the header itself, so it survives every redraw of its contents and
    // works on the access screens, which have no drawer.
    headerBar.addEventListener('click', (event) => {
      const lang = event.target.closest('[data-lang]')?.dataset.lang;
      if (lang && lang !== state.language) store.set({ ...state, language: lang });
    });

    // The brief's screen order: registration - which is where the consent
    // journey lives - or login for a returning tenant, then the demo-only role
    // selector, then the app. The access screens have no tab of their own, so
    // the header carries the product name until the app proper takes over.
    headerBar.innerHTML = accessHeader(state.language);

    accessView = mountAccess(screen, {
      store,
      onDone: () => {
        accessView = null;
        appView = start(() => app, store);
        // Watt explains the app in place, over the working screen, rather than
        // in a wall of introduction pages in front of it. He runs every time
        // rather than only on first open: this is a demonstrator, and whoever
        // is being shown it has not seen the introduction before.
        mountTour(document.getElementById('phone'), store.get().language,
          () => store.set({ ...store.get(), tourDone: true }),
          { onScreen: appView.go });
      },
    });
  } catch (error) {
    screen.textContent = 'Opstartfout: ' + error.message;
    throw error;
  }
});

console.info(BRAND.name + ' demo date: ' + DEMO_TODAY);

</script>
</body>
</html>
