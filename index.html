<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Woneco</title>
<style>
/* Woneco design tokens. Values mirror BRAND.palette in js/brand.js. */
:root {
  --green-900: #1F4128;
  --green-600: #2E5D3A;
  --green-100: #E8F0EA;
  --accent: #F2B705;
  --ink: #1A1A1A;
  --surface: #FFFFFF;

  --font-base: 20px;   /* Report 6's validated default text size */
  --tap-min: 48px;
  --radius: 14px;
  --gap: 16px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: var(--font-base);
  line-height: 1.5;
  color: var(--ink);
  background: #d8dcd9;
  min-height: 100vh;
}

#phone {
  /* Positioned so the drawer and the tour overlay (#nav, .tour-*) anchor to
     the phone rather than to the viewport once the shell offsets it. */
  position: relative;
  width: 390px;
  height: 844px;
  background: var(--surface);
  border-radius: 36px;
  box-shadow: 0 12px 48px rgba(0, 0, 0, .28);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

@media (max-width: 480px) {
  body { background: var(--surface); }
  #phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
}

#screen { flex: 1; overflow-y: auto; padding: var(--gap); }
#tabs { flex: none; }

#boot-status {
  color: var(--green-900);
  background: var(--green-100);
  border-radius: var(--radius);
  padding: var(--gap);
}

#boot-status h1 { margin: 0 0 .1em; font-size: 30px; }
#boot-status .tagline { margin: 0 0 1em; font-size: 17px; }

.figure { font-size: 34px; font-weight: 700; color: var(--green-900); }
.stage { display: inline-block; background: var(--accent); color: var(--ink);
         border-radius: 999px; padding: 2px 12px; font-size: 16px; font-weight: 600; }

.withheld { border-left: 4px solid var(--accent); padding-left: 12px; margin: 1em 0; font-size: 17px; }

.illustrative { font-size: 14px; color: #4a5a50; margin-top: 1.2em; }

.tree { display: block; width: 150px; height: 156px; margin: 4px auto 8px; }

/* --- Onboarding (Watt's introduction) --- */
.onboarding { display: flex; flex-direction: column; min-height: 100%; }
.progress { margin-bottom: 8px; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #cdd8d0; }
.dot.on { background: var(--green-600); }
.step-count { text-align: center; font-size: 14px; color: #4a5a50; margin: 6px 0 0; }

.watt { display: flex; justify-content: center; margin: 10px 0 4px; }
.watt .watt-figure { width: 76px; height: 103px; }
.watt-inline { display: flex; align-items: center; gap: 12px; }
.watt-inline .watt-figure { width: 44px; height: 60px; }
.watt-inline p { margin: 0; font-size: 16px; }
.onboarding h2 { color: var(--green-900); font-size: 26px; margin: 0 0 .3em; }
.onboarding .body { margin: 0 0 1em; }

.consent { background: var(--green-100); border-radius: var(--radius); padding: 12px; }
.consent-row { display: flex; gap: 12px; align-items: flex-start;
               min-height: var(--tap-min); padding: 6px 0; font-size: 18px; cursor: pointer; }
.consent-row input { width: 26px; height: 26px; margin-top: 4px; accent-color: var(--green-600); flex: none; }
.reassure { font-size: 15px; color: #3c4d43; margin: 8px 0 0; }

.field { display: flex; justify-content: space-between; align-items: center;
         gap: 12px; min-height: var(--tap-min); font-size: 18px; }
.field select { font-size: 18px; padding: 8px; border-radius: 8px;
                border: 2px solid var(--green-600); background: var(--surface); }

.actions { display: flex; gap: 10px; margin-top: auto; padding-top: 20px; }
.btn { flex: 1; min-height: var(--tap-min); font-size: 19px; font-weight: 600;
       color: var(--surface); background: var(--green-600); border: none;
       border-radius: var(--radius); cursor: pointer; padding: 12px; }
.btn.ghost { background: transparent; color: var(--green-900); border: 2px solid var(--green-600); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* --- Tab bar --- */
.tabbar { display: flex; border-top: 1px solid #d3ddd6; background: var(--surface); }
.tab { flex: 1; min-height: 62px; border: none; background: none; cursor: pointer;
       display: flex; flex-direction: column; align-items: center; justify-content: center;
       gap: 2px; padding: 6px 2px; color: #4a5a50; }
.tab-icon { font-size: 21px; line-height: 1; }
.tab-label { font-size: 12px; font-weight: 600; }
.tab.active { color: var(--green-900); box-shadow: inset 0 3px 0 var(--green-600); }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

/* --- Cards and stats --- */
.card { background: var(--green-100); border-radius: var(--radius); padding: 14px; margin: 12px 0; }
.card.warn { background: #FDF3D7; border-left: 4px solid var(--accent); }
.card h3 { margin: 0 0 .4em; font-size: 19px; color: var(--green-900); }
.card h4 { margin: .9em 0 .2em; font-size: 16px; color: var(--green-900); }
.stat { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 5px 0; }
.stat-label { flex: 1; font-size: 17px; }
.stat-value { font-weight: 700; font-size: 21px; color: var(--green-900); }
.stat-hint { flex-basis: 100%; font-size: 14px; color: #4a5a50; }
.note { font-size: 15px; color: #3c4d43; margin: .5em 0 0; }

/* --- Progress bar --- */
.bar { height: 12px; border-radius: 999px; background: #cdd8d0; overflow: hidden; margin-top: 6px; }
.bar-fill { height: 100%; background: var(--green-600); }
.bar-caption { font-size: 16px; margin: 6px 0 0; }

/* --- Chart --- */
.chart { margin: 0; }
.chart svg { width: 100%; height: auto; }
.legend { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #3c4d43; flex-wrap: wrap; }
.key { width: 16px; height: 0; border-top: 2.5px solid var(--green-900); display: inline-block; }
.key.dashed { border-top: 2px dashed var(--green-600); }

/* --- Badges, tips, help --- */
.badge { display: inline-block; font-size: 13px; font-weight: 700; border-radius: 999px;
         padding: 3px 10px; margin: 6px 0 0; }
.badge.meter { background: var(--green-600); color: #fff; }
.badge.self { background: var(--accent); color: var(--ink); }
.tip-euro { font-size: 22px; font-weight: 700; color: var(--green-900); margin: 0 0 .2em; }
.help { border-top: 1px solid #cbd8ce; padding: 8px 0; }
.help summary { cursor: pointer; min-height: 32px; font-size: 17px; }

/* --- Header --- */
#header { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px;
          border-bottom: 1px solid #d3ddd6; background: var(--surface); flex: none; }
.header-title { font-size: 19px; font-weight: 700; color: var(--green-900); }

/* Watt's explanation of this screen, always in the same corner so it can be
   found without looking for it. */
.info-button { width: 36px; height: 36px; flex: none; cursor: pointer;
               border: 2px solid var(--green-600); border-radius: 50%; background: transparent;
               color: var(--green-600); font-size: 19px; font-weight: 700;
               font-family: Georgia, "Times New Roman", serif; line-height: 1; }
.info-button:hover { background: var(--green-100); }
.info-button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* --- Overlays: the info sheet, and the tour layer --- */
#nav { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
#nav:empty { display: none; }

.sheet-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 80%; overflow-y: auto;
         background: var(--surface); border-radius: 22px 22px 0 0; padding: 16px 18px 24px;
         box-shadow: 0 -8px 30px rgba(0,0,0,.28); pointer-events: auto; }
.sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.sheet-head h3 { margin: 0; font-size: 20px; color: var(--green-900); flex: 1; }
.sheet-watt .watt-figure { width: 40px; height: 54px; }
.sheet-close { width: var(--tap-min); height: var(--tap-min); border: none; background: none;
               font-size: 30px; line-height: 1; cursor: pointer; color: var(--green-900); flex: none; }
.sheet-item { padding: 10px 0; border-top: 1px solid #e2e6e3; }
.sheet-item:first-of-type { border-top: none; }
.sheet-item strong { display: block; font-size: 17px; color: var(--green-900); margin-bottom: 2px; }
.sheet-item p { margin: 0; font-size: 16px; }

/* --- Dashboard figures --- */
.tree-name { text-align: center; font-size: 18px; font-weight: 700; color: var(--green-900);
             margin: -4px 0 6px; }
.figure-units { text-align: center; font-size: 15px; color: #4a5a50; margin: -6px 0 10px; }
.figure { text-align: center; }
.stage { display: block; width: fit-content; margin: 0 auto; }

/* --- Combined tip / notification card --- */
.tip-card { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left;
            background: var(--green-100); border: none; border-left: 4px solid var(--accent);
            border-radius: var(--radius); padding: 12px 14px; margin: 14px 0; cursor: pointer;
            min-height: var(--tap-min); font: inherit; color: var(--ink); }
.tip-kicker { font-size: 13px; font-weight: 700; text-transform: uppercase;
              letter-spacing: .04em; color: #4a5a50; }
.tip-title { font-size: 18px; font-weight: 600; color: var(--green-900); }
.tip-points { font-size: 15px; font-weight: 700; color: var(--green-600); }

/* --- Guided tour --- */
.tour-layer { position: absolute; inset: 0; z-index: 60; }
.tour-dim { position: absolute; inset: 0; background: rgba(20,32,24,.45); }
.tour-ring { position: absolute; border: 3px solid var(--accent); border-radius: 12px;
             box-shadow: 0 0 0 9999px rgba(20,32,24,.45); pointer-events: none; }
.tour-bubble { position: absolute; right: 12px; display: flex; gap: 8px; align-items: flex-end; }
.watt-figure { width: 62px; height: 84px; flex: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,.3)); }
.tour-speech { position: relative; background: var(--surface); border-radius: 16px;
               padding: 14px 16px 10px; box-shadow: 0 8px 26px rgba(0,0,0,.3); flex: 1; }
.tour-speech::after { content: ''; position: absolute; left: -9px; bottom: 22px;
                      border: 9px solid transparent; border-right-color: var(--surface); }
.tour-title { margin: 0 0 .25em; font-size: 18px; font-weight: 700; color: var(--green-900); }
.tour-body { margin: 0 0 .7em; font-size: 16px; line-height: 1.45; }
.tour-actions { display: flex; }
.tour-actions .btn { min-height: 42px; font-size: 17px; }
.tour-skip { display: block; margin: 8px auto 0; border: none; background: none; cursor: pointer;
             font-size: 14px; color: #4a5a50; text-decoration: underline; }
.tour-counter { margin: 2px 0 0; text-align: center; font-size: 13px; color: #6b7a70; }

/* --- Name and season chips --- */
.name-choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.chip { min-height: 42px; padding: 8px 16px; border-radius: 999px; cursor: pointer;
        border: 2px solid var(--green-600); background: var(--surface);
        color: var(--green-900); font-size: 17px; font-weight: 600; }
.chip.on { background: var(--green-600); color: #fff; }
.field input[type="text"] { font-size: 18px; padding: 8px 10px; border-radius: 8px;
        border: 2px solid var(--green-600); width: 55%; }
.tree-thirsty, .tree-wilting { transition: none; }

/* --- Registration, login and the demo-only role selector --- */
.access { display: flex; flex-direction: column; min-height: 100%; }
.access h2 { color: var(--green-900); font-size: 26px; margin: 0 0 .3em; }
.access .body { margin: 0 0 1em; }
.field.stacked { flex-direction: column; align-items: stretch; gap: 4px; margin-bottom: 12px; }
.field.stacked input { font-size: 18px; padding: 10px; border-radius: 8px;
                       border: 2px solid var(--green-600); background: var(--surface); }

/* Anything that exists only because this is a demonstrator says so, loudly. */
.demo-only { border-left: 4px solid #b4711a; background: #fdf6e7; padding: 10px 12px;
             border-radius: 8px; font-size: 15px; color: #5a4413; margin: 0 0 14px; }

.role { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
        min-height: var(--tap-min); padding: 14px; margin-bottom: 10px; cursor: pointer;
        background: var(--green-100); border: 2px solid transparent; border-radius: var(--radius); }
.role:hover, .role:focus-visible { border-color: var(--green-600); outline: none; }
.role-glyph { font-size: 30px; line-height: 1; }
.role-text { display: flex; flex-direction: column; gap: 2px; }
.role-text strong { color: var(--green-900); font-size: 19px; }
.role-text span { font-size: 15px; color: #3c4d43; }

/* --- Notification and tip history --- */
.notices { list-style: none; margin: 0; padding: 0; }
.notice { display: flex; flex-direction: column; gap: 2px; padding: 10px 0;
          border-bottom: 1px solid #d3ddd6; }
.notice:last-child { border-bottom: none; }
.notice-date { font-size: 13px; color: #4a5a50; }
.notice-body { font-size: 17px; }
.notice.good .notice-body { color: var(--green-900); font-weight: 600; }
.notice-tip { font-size: 15px; color: #3c4d43; }

/* Larger text, from Settings. Report 6 validated 20px as the default. */
#phone[data-large="true"] { --font-base: 23px; font-size: 23px; }

/* Layout: the phone, centred. */
#stage { min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 16px; padding: 20px; }

#phone { max-height: min(844px, calc(100vh - 160px)); }

@media (max-width: 480px) {
  #stage { padding: 0; gap: 0; justify-content: flex-start; }
  /* On a real phone there is no desk to leave room for. The clamp above is
     for the framed preview on a laptop, and would otherwise leave a dead
     strip below the app on the device it is actually designed for. */
  #phone { max-height: none; }
}

/* NL/EN in the header: reachable from the very first screen, before the
   Profile screen that carries the other toggle even exists. */
.lang-switch { margin-left: auto; display: flex; gap: 4px; flex: none; }
.lang-switch .chip { min-height: 34px; padding: 4px 10px; font-size: 14px; font-weight: 700; }
.header-title.brand { font-size: 21px; }

/* The first question: which language. Each option is written in its own
   language, so neither depends on already understanding the other. */
.lang-choice { display: flex; flex-direction: column; gap: 12px; }
.lang-option { display: flex; flex-direction: column; gap: 2px; text-align: left;
               min-height: 64px; padding: 14px 16px; cursor: pointer;
               background: var(--green-100); border: 2px solid transparent;
               border-radius: var(--radius); color: var(--ink); }
.lang-option strong { font-size: 21px; color: var(--green-900); }
.lang-option span { font-size: 15px; color: #3c4d43; }
.lang-option.on { border-color: var(--green-600); background: var(--surface); }
.lang-option.on strong::after { content: " \2713"; color: var(--green-600); }
.lang-option:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* --- The growth ladder: every stage of the tree at once --- */
.ladder { list-style: none; margin: 0; padding: 0; }
.rung { display: flex; align-items: center; gap: 14px; padding: 10px 12px; margin-bottom: 8px;
        border-radius: var(--radius); background: var(--green-100); border: 2px solid transparent; }
/* Unreached stages stay visible but drained: hiding them would remove the
   whole point of showing the ladder. */
.rung:not(.reached) { opacity: .45; filter: grayscale(1); background: #eef1ef; }
.rung.current { border-color: var(--green-600); background: var(--surface); }
.rung .tree { width: 76px; height: 79px; margin: 0; flex: none; }
.rung-text { display: flex; flex-direction: column; gap: 2px; }
.rung-text strong { font-size: 18px; color: var(--green-900); }
.rung-status { font-size: 14px; color: #3c4d43; }
.rung.current .rung-status { color: var(--green-600); font-weight: 700; }

/* The level chip on the home screen opens the ladder, so it is a button. */
button.stage { border: none; font-family: inherit; }
button.stage:focus-visible { outline: 3px solid var(--green-600); outline-offset: 2px; }

/* --- The four screens that are not on the bottom bar, listed in Profile --- */
.more-links { display: flex; flex-direction: column; }
.more-link { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
             min-height: var(--tap-min); padding: 10px 4px; cursor: pointer;
             background: none; border: none; border-bottom: 1px solid #cbd8ce;
             font-size: 18px; color: var(--ink); font-family: inherit; }
.more-link:last-child { border-bottom: none; }
.more-icon { font-size: 20px; line-height: 1; flex: none; }
.more-chevron { margin-left: auto; font-size: 24px; color: var(--green-600); }
.more-link:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

</style>
</head>
<body>
<div id="stage">
  <div id="phone">
    <header id="header"></header>
    <main id="screen"><div id="boot-status">Laden&hellip;</div></main>
    <footer id="tabs"></footer>
    <div id="nav"></div>
  </div>
</div>
<script type="module">
// ---- js/brand.js ----
/**
 * Brand identity for the Energieverdienspel tenant app.
 *
 * This is the ONLY place the product name, assistant and palette are defined.
 * Handover decision D9 requires name and mascot to be settled before the UI is
 * built and easy to change afterwards. To rebrand: edit this file only.
 */
const BRAND = Object.freeze({
  name: 'Woneco',

  tagline: Object.freeze({
    nl: 'Bespaar zonder in de kou te zitten',
    en: 'Save without going cold',
  }),

  assistant: Object.freeze({
    name: 'Watt',
    glyph: '\u{1F50B}', // battery
  }),

  // 'tree' selects the 6-stage growing tree in js/ui/tree.js (Plan B).
  mascot: 'tree',

  palette: Object.freeze({
    green900: '#1F4128',
    green600: '#2E5D3A',
    green100: '#E8F0EA',
    accent: '#F2B705',
    ink: '#1A1A1A',
    surface: '#FFFFFF',
  }),
});

// ---- js/i18n.js ----
/**
 * Dutch first, English second.
 *
 * Dutch is the product language: the users are Heerlen-Noord tenants and the
 * handover requires the consent flow in plain Dutch. English exists so DACS
 * and examiners can read the app, not because tenants need it.
 *
 * Copy targets roughly B1 Dutch - short sentences, no jargon, no compound
 * nouns where a plain word will do.
 */
const LANGUAGES = Object.freeze(['nl', 'en']);
const DEFAULT_LANGUAGE = 'nl';

/**
 * Picks one of two literals by language.
 *
 * Most screen copy is written inline rather than through t(), because a wall
 * of keys is harder to review than the sentence itself. This helper is the one
 * shared way to do that, so the same arrow is not redefined in every screen
 * module - which also collided in the single-file bundle.
 */
function say(nl, en, lang) {
  return lang === 'en' ? en : nl;
}

const STRINGS = Object.freeze({
  'nav.home': { nl: 'Start', en: 'Home' },
  'nav.savings': { nl: 'Besparing', en: 'Savings' },
  'nav.challenges': { nl: 'Uitdagingen', en: 'Challenges' },
  'nav.tips': { nl: 'Tips', en: 'Tips' },
  'nav.profile': { nl: 'Profiel', en: 'Profile' },

  'home.saved': { nl: 'Zo ver ben je', en: 'Your progress' },
  'home.level': { nl: 'Niveau', en: 'Level' },
  'home.toNext': { nl: 'Nog {amount} tot het volgende niveau.',
                   en: '{amount} to go until the next level.' },
  'home.streak': { nl: '{days} dagen op rij', en: '{days} days in a row' },

  'comfort.title': { nl: 'Warmte telt niet als besparing',
                     en: 'Warmth does not count as saving' },
  'comfort.body': {
    nl: 'Je gebruikte {raw} minder dan verwacht, maar {withheld} daarvan telt niet mee. Op {days} van de {total} dagen stookte je minder dan gezond is. Warmte is niets om op te besparen.',
    en: 'You used {raw} less than expected, but {withheld} of that does not count. On {days} of {total} days you heated less than is healthy. Warmth is not something to save on.',
  },

  'data.lag': { nl: 'Laatste meting {date} — gegevens lopen een dag achter.',
                en: 'Last reading {date} — data runs one day behind.' },
  'data.illustrative': {
    nl: 'Alle bedragen zijn voorbeeldwaarden; er is nog geen echte P4-data.',
    en: 'All amounts are example values; there is no real P4 data yet.',
  },

  'error.boot': { nl: 'Opstartfout: {message}', en: 'Startup error: {message}' },
});

/**
 * Looks up a key and fills {placeholders}.
 * An unknown key returns the key itself rather than throwing, so a missing
 * string is visible in the UI instead of blanking a screen.
 */
function t(key, lang = DEFAULT_LANGUAGE, vars = {}) {
  const entry = STRINGS[key];
  if (!entry) return key;
  const template = entry[lang] ?? entry[DEFAULT_LANGUAGE];
  return template.replace(/\{(\w+)\}/g, (match, name) =>
    Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : match
  );
}

/** Every key defined, for completeness checks. */
function keys() {
  return Object.keys(STRINGS);
}

// ---- js/data/dates.js ----
/**
 * ISO date helpers. All arithmetic is done in UTC so results never shift
 * across a daylight-saving transition.
 */

const MS_PER_DAY = 86_400_000;

function toUtc(isoDate) {
  const [y, m, d] = isoDate.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}

function toIso(ms) {
  return new Date(ms).toISOString().slice(0, 10);
}

/** Returns isoDate shifted by n days. n may be negative. */
function addDays(isoDate, n) {
  return toIso(toUtc(isoDate) + n * MS_PER_DAY);
}

/** Returns the 1-based day of the year (1..366). */
function dayOfYear(isoDate) {
  const year = Number(isoDate.slice(0, 4));
  return Math.round((toUtc(isoDate) - Date.UTC(year, 0, 1)) / MS_PER_DAY) + 1;
}

/** Returns `count` ascending ISO dates ending at (and including) isoEndDate. */
function datesEndingAt(isoEndDate, count) {
  const end = toUtc(isoEndDate);
  return Array.from({ length: count }, (_, i) =>
    toIso(end - (count - 1 - i) * MS_PER_DAY)
  );
}

// ---- js/data/household.js ----
/**
 * Deterministic simulated household data.
 *
 * NOT real data. No live P4 access exists (handover Step 1: ODA registration
 * and DPIA are both outstanding). Everything here is generated from a seeded
 * PRNG so that every demo run is byte-identical.
 *
 * The series is generated from the same heating-slope form that
 * js/engine/model.js later fits. That makes the demonstrator internally
 * coherent; it does NOT validate the model. See "Over deze cijfers".
 */


/** Fixed demo date: mid heating season, so the heating slope is visible. */
const DEMO_TODAY = '2026-02-15';
const HISTORY_DAYS = 90;

const HOUSEHOLD = Object.freeze({
  occupants: 1,
  ageBand: '60+',
  floorAreaM2: 70,
  energyLabel: 'E',
  district: 'Heerlen-Noord',
});

// Underlying energy signature used to synthesise the series.
const GAS_BASELOAD_M3 = 0.35;   // hot water and cooking
const GAS_SLOPE_M3_PER_HDD = 0.22;
const ELEC_BASELOAD_KWH = 4.2;
const ELEC_SLOPE_KWH_PER_DARK_HOUR = 0.15;
const BALANCE_POINT_C = 15.5;

/**
 * How much the household improves across the whole 90 days.
 *
 * Deliberately small. Report 4 puts the realistic annual behavioural saving at
 * roughly EUR 44, and the handover's rule is that no figure the app shows may
 * imply more than the true ceiling. A generous improvement factor produces a
 * demo that saves several hundred euros a year, which is exactly the over-claim
 * the handover condemns. Guarded by the annualised-ceiling integration test.
 */
const IMPROVEMENT_OVER_PERIOD = 0.02;

// The under-consumption stretch, as indices into the 90-day series.
const UNDERHEAT_START = 55;
const UNDERHEAT_END = 70;
const UNDERHEAT_FACTOR = 0.70; // 30% below expected: below the 0.80 comfort floor

/**
 * Three households a presenter can switch between.
 *
 * Two mechanisms in this design are load-bearing and were invisible in the
 * demo, because the only simulated household saved steadily and so always had
 * a healthy tree:
 *
 *  - `slipping` uses MORE than expected for a fortnight, which is the only
 *    thing that makes a tree wilt. Its level does not drop: growth is
 *    permanent, health is temporary.
 *  - `hardship` heats far below what the weather implies. It shows the comfort
 *    floor withholding credit, and its tree stays healthy - a household in
 *    hardship must never be handed a dying tree on top of a cold house.
 *
 * All three share one seed, so the weather is identical across them and what
 * differs on screen is behaviour rather than luck.
 */
const HOUSEHOLD_PROFILES = Object.freeze([
  Object.freeze({
    id: 'saver', improvement: IMPROVEMENT_OVER_PERIOD,
    underheat: Object.freeze({ start: UNDERHEAT_START, end: UNDERHEAT_END, factor: UNDERHEAT_FACTOR }),
    drift: null,
    nl: Object.freeze({ title: 'Bespaart', hint: 'Gestaag beter dan verwacht.' }),
    en: Object.freeze({ title: 'Saving', hint: 'Steadily better than expected.' }),
  }),
  Object.freeze({
    id: 'slipping', improvement: 0,
    underheat: null,
    // The last fortnight above expectation - the only route to a wilting tree.
    drift: Object.freeze({ days: 14, factor: 1.2 }),
    nl: Object.freeze({ title: 'Zakt terug', hint: 'Twee weken meer dan verwacht: de boom hangt.' }),
    en: Object.freeze({ title: 'Slipping', hint: 'A fortnight above expectation: the tree droops.' }),
  }),
  Object.freeze({
    id: 'hardship', improvement: 0.01,
    underheat: Object.freeze({ start: 40, end: HISTORY_DAYS, factor: 0.62 }),
    drift: null,
    nl: Object.freeze({ title: 'Stookt te weinig', hint: 'Onder de comfortgrens. Er wordt niets bijgeschreven.' }),
    en: Object.freeze({ title: 'Under-heating', hint: 'Below the comfort floor. Nothing is credited.' }),
  }),
]);

const DEFAULT_PROFILE = 'saver';

/** A profile by id. An unknown id falls back rather than breaking a demo. */
function profileById(id) {
  return HOUSEHOLD_PROFILES.find((p) => p.id === id) ?? HOUSEHOLD_PROFILES[0];
}

/** mulberry32 - small, fast, fully deterministic PRNG. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const round2 = (x) => Math.round(x * 100) / 100;

/** Seasonal mean temperature for Heerlen, degrees Celsius. */
function seasonalTempC(isoDate) {
  const doy = dayOfYear(isoDate);
  return 9.5 - 7.5 * Math.cos((2 * Math.PI * (doy - 15)) / 365);
}

/** Daylight hours at latitude ~50.9 N. */
function daylightHours(isoDate) {
  const doy = dayOfYear(isoDate);
  return 12.3 - 4.3 * Math.cos((2 * Math.PI * (doy + 10)) / 365);
}

/** The most recent reading available: always the day before DEMO_TODAY. */
function lastReadingDate() {
  return addDays(DEMO_TODAY, -1);
}

/**
 * Returns HISTORY_DAYS ascending readings ending at lastReadingDate().
 *
 * Deterministic: same output on every call and every machine. The default
 * profile reproduces exactly what this function returned before profiles
 * existed, so every figure in the tests and in the demo is unchanged.
 */
function generateHistory(profileId = DEFAULT_PROFILE) {
  const profile = profileById(profileId);
  const rand = mulberry32(20260215);
  const dates = datesEndingAt(lastReadingDate(), HISTORY_DAYS);
  const driftFrom = profile.drift ? HISTORY_DAYS - profile.drift.days : HISTORY_DAYS;

  return dates.map((date, i) => {
    const tempAvgC = seasonalTempC(date) + (rand() - 0.5) * 5;
    const daylight = daylightHours(date);
    const hdd = Math.max(0, BALANCE_POINT_C - tempAvgC);
    const darkHours = Math.max(0, 12 - daylight);

    const expectedGas = GAS_BASELOAD_M3 + GAS_SLOPE_M3_PER_HDD * hdd;
    const expectedElec = ELEC_BASELOAD_KWH + ELEC_SLOPE_KWH_PER_DARK_HOUR * darkHours;

    // Behaviour: the household gradually improves over the 90 days.
    const improvement = 1 - profile.improvement * (i / HISTORY_DAYS);

    // A deliberate stretch of under-heating, so the comfort floor can be shown.
    const underheating = profile.underheat
      && i >= profile.underheat.start && i < profile.underheat.end
      ? profile.underheat.factor : 1;

    // A late stretch ABOVE expectation - the only thing that wilts a tree.
    const drift = i >= driftFrom ? profile.drift.factor : 1;

    const gas = expectedGas * improvement * underheating * drift * (0.92 + rand() * 0.16);
    const elec = expectedElec * improvement * (0.94 + rand() * 0.12);

    return {
      date,
      gas_m3: round2(Math.max(0, gas)),
      elec_kwh: round2(Math.max(0, elec)),
      temp_avg_c: round2(tempAvgC),
      daylight_hours: round2(daylight),
    };
  });
}

// ---- js/engine/model.js ----
/**
 * Expected-consumption model: an interpretable energy signature.
 *
 *   expected_gas(d)  = baseload + slope x heating-degree-days(d)
 *   expected_elec(d) = baseload + slope x darkness hours(d)
 *
 * Fitted by ordinary least squares - the same approach used in the
 * "Op koers?" dashboard, for consistency across the two halves of the project.
 *
 * Structure follows Grillone et al. (2021), the change-point / heating-slope
 * design Report 3 actually describes. The handover corrects Report 3's citation
 * of Wang, Sun & Lall (2017), which is a monthly, state-level, cooling-only
 * model and is not a structural template.
 *
 * This is a documented STAND-IN for the hierarchical Bayesian model, not a
 * trained Bayesian model, and must be labelled as such wherever it surfaces.
 */

/** Balance-point temperature for Dutch dwellings (assumption A5). */
const T_BASE_C = 15.5;

/** 95% interval multiplier. */
const CONFIDENCE_Z = 1.96;

/** Above this band-width-to-prediction ratio the app shows no advice. */
const MAX_BAND_RATIO = 0.40;

/**
 * Days used to learn the household's signature before any saving is measured.
 *
 * The model MUST NOT be fitted to the same days it is then measured against:
 * ordinary least squares drives the residuals to sum to zero, so the honest
 * net saving over the fitted window is exactly EUR 0,00 by construction, while
 * the daily-floored credited figure still accumulates the positive half of the
 * noise. That would grow the tree for a household that saved nothing.
 *
 * Fitting a baseline period and reporting on the days after it is the standard
 * measurement-and-verification split, and it is what the handover means when
 * it says the savings claim needs "a proper baseline" (Report 2).
 */
const BASELINE_DAYS = 45;

/** Heating-degree-days for one day. */
function hdd(tempAvgC, tBase = T_BASE_C) {
  return Math.max(0, tBase - tempAvgC);
}

/** Hours of darkness beyond a nominal 12-hour day. */
function darknessHours(daylight) {
  return Math.max(0, 12 - daylight);
}

/** Ordinary least squares for y = intercept + slope * x. */
function fitLinear(xs, ys) {
  const n = xs.length;
  if (n < 3) throw new Error(`fitLinear needs at least 3 points, got ${n}`);

  const meanX = xs.reduce((s, x) => s + x, 0) / n;
  const meanY = ys.reduce((s, y) => s + y, 0) / n;

  let sxy = 0;
  let sxx = 0;
  for (let i = 0; i < n; i += 1) {
    sxy += (xs[i] - meanX) * (ys[i] - meanY);
    sxx += (xs[i] - meanX) ** 2;
  }

  const slope = sxx === 0 ? 0 : sxy / sxx;
  const intercept = meanY - slope * meanX;

  let sse = 0;
  for (let i = 0; i < n; i += 1) {
    sse += (ys[i] - (intercept + slope * xs[i])) ** 2;
  }
  const residualSd = Math.sqrt(sse / (n - 2));

  return { intercept, slope, residualSd, n };
}

/** Fits both fuel signatures from a reading history. */
function fitModel(readings) {
  return {
    gas: fitLinear(readings.map((r) => hdd(r.temp_avg_c)), readings.map((r) => r.gas_m3)),
    elec: fitLinear(
      readings.map((r) => darknessHours(r.daylight_hours)),
      readings.map((r) => r.elec_kwh)
    ),
  };
}

/**
 * Splits a history into the baseline window the model learns from and the
 * report window over which savings are actually measured.
 */
function splitBaseline(readings, baselineDays = BASELINE_DAYS) {
  if (readings.length <= baselineDays) {
    throw new Error(
      `splitBaseline: need more than ${baselineDays} readings, got ${readings.length}`
    );
  }
  return {
    baseline: readings.slice(0, baselineDays),
    report: readings.slice(baselineDays),
  };
}

function predict(fit, x) {
  const point = Math.max(0, fit.intercept + fit.slope * x);
  const half = CONFIDENCE_Z * fit.residualSd;
  return { point, band: [Math.max(0, point - half), point + half] };
}

/** Expected consumption plus uncertainty band for one day's conditions. */
function expectedFor(model, reading) {
  const gas = predict(model.gas, hdd(reading.temp_avg_c));
  const elec = predict(model.elec, darknessHours(reading.daylight_hours));
  return {
    gas_m3: gas.point,
    elec_kwh: elec.point,
    gasBand: gas.band,
    elecBand: elec.band,
  };
}

/**
 * True when the band is tight enough for advice to be meaningful.
 * The handover requires a confidence cut-off below which the app shows
 * no advice rather than guessing.
 */
function isConfident(model, expected) {
  const ratio = (fit, point) =>
    point <= 0 ? Infinity : (2 * CONFIDENCE_Z * fit.residualSd) / point;
  return (
    ratio(model.gas, expected.gas_m3) <= MAX_BAND_RATIO &&
    ratio(model.elec, expected.elec_kwh) <= MAX_BAND_RATIO
  );
}

// ---- js/engine/comfort.js ----
/**
 * Comfort floor - handover decision D3.
 *
 * Nothing in any of the six reports prevented the game rewarding a household
 * for under-heating, which is exactly the pattern the "Op koers?" dashboard
 * reads as hardship. This module closes that loop: savings are credited only
 * down to the floor, and consumption below it earns nothing further.
 *
 * COMFORT_FLOOR_RATIO is a documented PLACEHOLDER. DACS sets the real value
 * per home type and season under D3.
 */

const COMFORT_FLOOR_RATIO = 0.80;

/** Report 2's hidden energy-poverty rule: below 40% of expected... */
const POVERTY_RATIO = 0.40;
/** ...sustained for three months or more. */
const POVERTY_MIN_DAYS = 90;

/** The lowest consumption level that still earns credit. */
function floorValue(expected, ratio = COMFORT_FLOOR_RATIO) {
  return expected * ratio;
}

/**
 * Tolerance for the floor comparison.
 *
 * expected * ratio is not exact in binary floating point - 6 * 0.8 is
 * 4.800000000000001 - so a household sitting exactly on the floor would
 * otherwise be misclassified as under-heating and lose its credit.
 */
const FLOOR_EPSILON = 1e-9;

/** True when actual consumption has dropped below the comfort floor. */
function isBelowComfortFloor(expected, actual, ratio = COMFORT_FLOOR_RATIO) {
  return actual < floorValue(expected, ratio) - FLOOR_EPSILON;
}

/**
 * The consumption figure the savings engine is allowed to reward.
 * Clamped UP to the floor, so cutting below it yields no extra euros.
 */
function rewardableConsumption(expected, actual, ratio = COMFORT_FLOOR_RATIO) {
  return Math.max(actual, floorValue(expected, ratio));
}

/**
 * Report 2's hidden energy-poverty signal, evaluated over the most recent run
 * of consecutive days. Returns the length of the current below-threshold run.
 */
function hiddenPovertySignal(pairs) {
  let daysBelow = 0;
  for (let i = pairs.length - 1; i >= 0; i -= 1) {
    const { expectedGas, actualGas } = pairs[i];
    if (expectedGas > 0 && actualGas < expectedGas * POVERTY_RATIO) daysBelow += 1;
    else break;
  }
  return { flagged: daysBelow >= POVERTY_MIN_DAYS, daysBelow };
}

// ---- js/engine/savings.js ----
/**
 * THE SINGLE SOURCE OF TRUTH FOR EVERY EURO IN THE APP.
 *
 * Handover decision D4: three reports priced the same behaviour differently and
 * at least one was wrong. No screen may compute its own euros - they all read
 * from here.
 *
 * Only usage-based gas and electricity vary with behaviour (Report 4's cost
 * model, adopted as canonical). Fixed costs and taxes are 38% of the bill and
 * behaviour cannot touch them.
 */


/** Canonical. Equals EUR 0,15/kWh at ~8,8 kWh/m3 - one price, two units. */
const PRICE_GAS_EUR_PER_M3 = 1.35;

/**
 * ASSUMPTION A1 - not fixed by any report. Must be confirmed before any
 * external use, and is labelled as unconfirmed on the "Over deze cijfers" page.
 */
const PRICE_ELEC_EUR_PER_KWH = 0.35;

/** Share of the bill behaviour cannot influence. */
const FIXED_COST_SHARE = 0.38;

/**
 * Turning the thermostat down 1 degree: 0,9 kWh ~ EUR 0,14/day.
 * Report 5 priced this at EUR 0,90 by copying a kWh figure into euros.
 * That error must not reappear anywhere.
 */
const THERMOSTAT_1C_EUR_PER_DAY = 0.14;

function toEuro(gasM3, elecKwh) {
  return gasM3 * PRICE_GAS_EUR_PER_M3 + elecKwh * PRICE_ELEC_EUR_PER_KWH;
}

/**
 * Signed daily saving. THIS is what the Savings tab reports - it goes down on
 * days above expected, and that honesty is the point.
 */
function netSaving(expected, actual) {
  return toEuro(expected.gas_m3 - actual.gas_m3, expected.elec_kwh - actual.elec_kwh);
}

/** Net, floored at zero. Used to decide whether a day counts for the streak. */
function grossSaving(expected, actual) {
  return Math.max(0, netSaving(expected, actual));
}

/**
 * One day's saving with the comfort floor applied, sign preserved.
 *
 * A fuel whose consumption fell BELOW the comfort floor contributes nothing at
 * all that day - not even the saving down to the floor. A household heating
 * below the safe band is in hardship, not saving, and the app must never pay
 * for that. Crediting down to the floor would make the coldest, hardest days
 * the most profitable of the year, which inverts the purpose of decision D3.
 *
 * Days above expected still contribute negatively, so bad days offset good.
 */
function comfortCappedNet(expected, actual) {
  const gas = isBelowComfortFloor(expected.gas_m3, actual.gas_m3)
    ? 0
    : expected.gas_m3 - actual.gas_m3;
  const elec = isBelowComfortFloor(expected.elec_kwh, actual.elec_kwh)
    ? 0
    : expected.elec_kwh - actual.elec_kwh;
  return toEuro(gas, elec);
}

/**
 * One day's saving, floored at zero and capped by the comfort floor.
 *
 * WARNING: do NOT accumulate this across days. Flooring every day discards the
 * negative half of daily variation while banking the positive half, so a
 * household that saved nothing still accrues euros from noise alone. On this
 * demo series that bias was worth about EUR 95 a year - more than twice the
 * real ceiling. Use cumulativeCredited() for any running total.
 *
 * Kept for single-day display only.
 */
function creditedSaving(expected, actual) {
  return Math.max(0, comfortCappedNet(expected, actual));
}

/**
 * Total credited euros across a paired series.
 *
 * Sums the SIGNED comfort-capped daily figure and floors the total once, so
 * good and bad days offset and only genuine sustained saving accumulates.
 * May be lower than a previous call's result on a bad run - the tree does not
 * regress because levels track the high-water mark (see treeProgress()).
 */
function cumulativeCredited(expectedList, actualList) {
  if (expectedList.length !== actualList.length) {
    throw new Error(
      `cumulativeCredited: series length mismatch (${expectedList.length} vs ${actualList.length})`
    );
  }
  return Math.max(0, expectedList.reduce(
    (sum, e, i) => sum + comfortCappedNet(e, actualList[i]), 0
  ));
}

/**
 * The figure the tree reads: the highest cumulative total ever reached.
 * This is what guarantees the tree never shrinks, without needing the
 * noise-banking daily floor that guarantee used to rely on.
 */
function treeProgress(expectedList, actualList) {
  let running = 0;
  let peak = 0;
  expectedList.forEach((e, i) => {
    running += comfortCappedNet(e, actualList[i]);
    peak = Math.max(peak, running);
  });
  return peak;
}

/**
 * Points per euro saved.
 *
 * Tip and notification copy is points-denominated rather than euro-denominated.
 * That deliberately sidesteps the EUR 0,90-vs-EUR 0,14 contradiction the
 * handover flags between Reports 3 and 5: a point is an internal unit and
 * cannot be wrong about somebody's bill.
 *
 * Confirmed by the team on 2026-08-10 (brief, section 5 checklist). Euro
 * figures still appear where euros are the honest unit - the headline saving,
 * the Savings screen, and the per-tip annual estimates.
 */
const POINTS_PER_EURO = 100;

/** Converts a euro amount to whole points. */
function toPoints(euros) {
  return Math.round(euros * POINTS_PER_EURO);
}

/**
 * The physical saving behind the credited euros, so kWh and m3 can be shown
 * as a secondary figure beside the euro (brief, Act 5).
 */
function comfortCappedUnits(expected, actual) {
  const gas = isBelowComfortFloor(expected.gas_m3, actual.gas_m3)
    ? 0 : expected.gas_m3 - actual.gas_m3;
  const elec = isBelowComfortFloor(expected.elec_kwh, actual.elec_kwh)
    ? 0 : expected.elec_kwh - actual.elec_kwh;
  return { gas_m3: gas, elec_kwh: elec };
}

/** Totals the physical saving across a paired series, floored at zero. */
function cumulativeUnits(expectedList, actualList) {
  return expectedList.reduce((sum, e, i) => {
    const u = comfortCappedUnits(e, actualList[i]);
    return { gas_m3: sum.gas_m3 + u.gas_m3, elec_kwh: sum.elec_kwh + u.elec_kwh };
  }, { gas_m3: 0, elec_kwh: 0 });
}

/** Dutch number with a comma decimal separator. */
function formatNumber(value, decimals = 1) {
  return value.toFixed(decimals).replace('.', ',');
}

/** Dutch euro formatting: comma decimal separator, always two decimals. */
function formatEuro(amount) {
  return `\u20AC${amount.toFixed(2).replace('.', ',')}`;
}

// ---- js/engine/periods.js ----
/**
 * The monthly / seasonal / yearly toggle on the Savings screen
 * (demonstrator brief, section 3).
 *
 * Only 45 measured days exist, so one of these three periods cannot be
 * measured - it can only be projected. That distinction is the whole point of
 * this module: `measured` says whether the figure counts real days or
 * extrapolates from them, and the screen is required to label a projection as
 * one. The handover's central complaint about the reports is exactly that
 * illustrative figures were presented as though they had been measured.
 */


/**
 * Days a Dutch heating season realistically runs.
 *
 * This is the denominator the yearly projection has to use. Every measured day
 * in the report window is a heating-season day, so scaling its rate across all
 * 365 days silently assumes a household saves as much on gas in July as in
 * January. It does not - and doing so tripled the projection past both Report
 * 4's EUR 44 headline and the EUR 62 recalculated ceiling.
 */
const HEATING_DAYS_PER_YEAR = 150;

const PERIODS = Object.freeze([
  Object.freeze({ id: 'month', days: 30, nl: 'Maand', en: 'Month' }),
  Object.freeze({ id: 'season', days: null, nl: 'Seizoen', en: 'Season' }),
  Object.freeze({ id: 'year', days: null, nl: 'Jaar', en: 'Year' }),
]);

function periodById(id) {
  return PERIODS.find((p) => p.id === id) ?? PERIODS[0];
}

/**
 * Totals for one period.
 *
 * month  - the last 30 measured days, or fewer if fewer exist.
 * season - every measured day in the report window.
 * year   - the measured daily rate scaled to 365 days. A projection.
 *
 * @returns {{ id, days, net, credited, perDay, measured, basedOnDays? }}
 */
function periodTotals(expectedSeries, readings, periodId) {
  const period = periodById(periodId);
  const total = readings.length;

  const take = period.id === 'month' ? Math.min(period.days, total) : total;
  const expected = expectedSeries.slice(-take);
  const actual = readings.slice(-take);

  const net = expected.reduce((sum, e, i) => sum + netSaving(e, actual[i]), 0);
  const credited = cumulativeCredited(expected, actual);
  const perDay = take === 0 ? 0 : net / take;

  if (period.id !== 'year') {
    return { id: period.id, days: take, net, credited, perDay, measured: true };
  }

  // Projected across the heating season only - see HEATING_DAYS_PER_YEAR.
  return {
    id: 'year',
    days: HEATING_DAYS_PER_YEAR,
    net: perDay * HEATING_DAYS_PER_YEAR,
    credited: (take === 0 ? 0 : credited / take) * HEATING_DAYS_PER_YEAR,
    perDay,
    measured: false,
    basedOnDays: take,
  };
}

// ---- js/engine/levels.js ----
/**
 * The growing tree: six levels, each harder to reach than the last.
 *
 * The tree changes ONLY at level-up, never continuously, and never wilts or
 * shrinks. On a bad day it simply does not grow. This is a deliberate
 * departure from Report 5's melting-ice mascot, which the critical review
 * found applies loss aversion to a financially vulnerable group - producing
 * guilt in households that have no remaining action available.
 *
 * Thresholds are cumulative CREDITED euros (js/engine/savings.js), which are
 * floored at zero and capped by the comfort floor.
 */

/**
 * Report 4's headline annual saving. The handover's recalculation puts the
 * realistic ceiling nearer EUR 62. Every promise must stay below the true
 * ceiling - a full tree at EUR 40 sits under both.
 */
const ANNUAL_CEILING_EUR = 44;

const LEVELS = Object.freeze([
  Object.freeze({ level: 1, threshold: 0, nl: 'Zaadje', en: 'Seed' }),
  Object.freeze({ level: 2, threshold: 2.5, nl: 'Kiem', en: 'Sprout' }),
  Object.freeze({ level: 3, threshold: 7, nl: 'Jong plantje', en: 'Seedling' }),
  Object.freeze({ level: 4, threshold: 14, nl: 'Struikje', en: 'Shrub' }),
  Object.freeze({ level: 5, threshold: 25, nl: 'Jonge boom', en: 'Young tree' }),
  Object.freeze({ level: 6, threshold: 40, nl: 'Volgroeide boom', en: 'Full tree' }),
]);

/** Current level (1..6) for a cumulative credited total. */
function levelFor(cumulativeEur) {
  let level = 1;
  for (const stage of LEVELS) {
    if (cumulativeEur >= stage.threshold) level = stage.level;
  }
  return level;
}

/** The stage record for the current level. */
function stageFor(cumulativeEur) {
  return LEVELS[levelFor(cumulativeEur) - 1];
}

/** Progress toward the next level. `next` is null once level 6 is reached. */
function progressToNext(cumulativeEur) {
  const current = stageFor(cumulativeEur);
  const next = LEVELS[current.level] ?? null;

  if (!next) return { current, next: null, euroToNext: 0, fraction: 1 };

  const span = next.threshold - current.threshold;
  const gained = cumulativeEur - current.threshold;
  return {
    current,
    next,
    euroToNext: next.threshold - cumulativeEur,
    fraction: span === 0 ? 1 : Math.min(1, Math.max(0, gained / span)),
  };
}

/** One streak shield is granted per level-up. */
function shieldsEarned(level) {
  return Math.max(0, level - 1);
}

// ---- js/engine/streak.js ----
/**
 * Streaks with a forgiveness day and shields (Report 5).
 *
 * A day qualifies when the daily action was completed OR the day's net saving
 * was positive. One missed day per rolling week is forgiven automatically;
 * beyond that a shield (one per level-up) may be spent; beyond that the
 * streak breaks.
 *
 * The forgiveness day exists because the target group includes people who are
 * away, unwell, or simply cannot act on a given day. Breaking a streak for
 * that would punish circumstance rather than behaviour.
 *
 * A forgiven day COUNTS toward the streak length. The alternative - preserving
 * the run but not the number - makes the streak appear to stall on a day the
 * app just told the tenant was forgiven, which reads as a broken promise.
 */

const FORGIVENESS_WINDOW_DAYS = 7;
const FORGIVENESS_ALLOWANCE = 1;

/**
 * Walks the history newest-first and stops at the first unabsorbed miss.
 * Returns the current run length and what was spent to keep it alive.
 */
function computeStreak(days, shieldsAvailable = 0) {
  let length = 0;
  let forgivenessUsed = 0;
  let shieldsUsed = 0;
  let shieldsLeft = shieldsAvailable;
  const missIndices = [];

  for (let i = days.length - 1; i >= 0; i -= 1) {
    const day = days[i];

    if (day.qualified) {
      length += 1;
      continue;
    }

    // Walking newest-first, every absorbed miss has an index greater than i.
    // Count those lying within seven days ahead of the one being judged.
    const windowEnd = i + FORGIVENESS_WINDOW_DAYS - 1;
    const missesInWindow = missIndices.filter((idx) => idx <= windowEnd).length;

    if (missesInWindow < FORGIVENESS_ALLOWANCE) {
      missIndices.push(i);
      forgivenessUsed += 1;
      length += 1;
      continue;
    }

    if (shieldsLeft > 0) {
      shieldsLeft -= 1;
      shieldsUsed += 1;
      missIndices.push(i);
      length += 1;
      continue;
    }

    return { length, forgivenessUsed, shieldsUsed, brokenOn: day.date };
  }

  return { length, forgivenessUsed, shieldsUsed, brokenOn: null };
}

// ---- js/engine/health.js ----
/**
 * Tree health: the wilt mechanism from the tree-mascot report.
 *
 * The report specifies loss aversion "on sustained decline, not on a single
 * bad day - same forgiveness-day-plus-shield scheme as the streak". So a
 * single day above expectation does nothing; only a persistent run does.
 *
 * SAFEGUARD, and it is not optional. Days below the comfort floor are excluded
 * entirely - they neither count as decline nor reset the count. A household
 * heating below the safe band already earns nothing (decision D3); wilting the
 * tree at them as well would put a dying plant on top of a cold house, and
 * would punish exactly the hardship the dashboard reads as energy poverty.
 * Wilting must only ever respond to using MORE than expected.
 */

/** Days of history the wilt check looks back over. */
const WILT_WINDOW_DAYS = 14;

/** Declining days within that window before the tree wilts. */
const WILT_THRESHOLD_DAYS = 10;

/** Declining days before the tree looks thirsty - the early, gentle warning. */
const THIRSTY_THRESHOLD_DAYS = 6;

const HEALTHY = 'healthy';
const THIRSTY = 'thirsty';
const WILTING = 'wilting';

/**
 * Assesses the tree from recent days.
 *
 * `days` is [{ net: number, belowFloor: boolean }], oldest first. A day
 * declines when net < 0 (more used than expected) AND the household was not
 * below the comfort floor.
 *
 * `shieldsAvailable` absorb declining days, exactly as they do for streaks.
 */
function treeHealth(days, shieldsAvailable = 0) {
  const window = days.slice(-WILT_WINDOW_DAYS);
  const counted = window.filter((d) => !d.belowFloor);
  const declining = counted.filter((d) => d.net < 0).length;

  const absorbed = Math.max(0, declining - shieldsAvailable);
  const shieldsUsed = Math.min(shieldsAvailable, declining);

  let state = HEALTHY;
  if (absorbed >= WILT_THRESHOLD_DAYS) state = WILTING;
  else if (absorbed >= THIRSTY_THRESHOLD_DAYS) state = THIRSTY;

  return { state, decliningDays: declining, absorbed, shieldsUsed,
           excludedByComfortFloor: window.length - counted.length };
}

/** Plain-language explanation. Never blames; always names the way back. */
function healthMessage(health, lang) {
  if (health.state === HEALTHY) return null;
  if (health.state === THIRSTY) {
    return lang === 'en'
      ? 'Your tree could use some attention. You have used a little more than expected on ' + health.decliningDays + ' recent days.'
      : 'Je boom kan wat aandacht gebruiken. Je gebruikte op ' + health.decliningDays + ' van de afgelopen dagen wat meer dan verwacht.';
  }
  return lang === 'en'
    ? 'Your tree is drooping. Use less than expected for a few days and it picks up again - it never loses a growth stage.'
    : 'Je boom hangt er slap bij. Gebruik een paar dagen minder dan verwacht, dan veert hij weer op. Hij verliest nooit een groeistap.';
}

// ---- js/data/notifications.js ----
/**
 * The notification and tip history (demonstrator brief, section 3).
 *
 * The brief merges Report 6's daily tip with Report 5's notification mechanic
 * into one card on the dashboard, and puts a history screen behind that card.
 * This builds the history from the days that actually exist, so the dates on
 * screen match the meter readings rather than being invented.
 *
 * Copy is points-denominated. Confirmed by the team on 2026-08-10, having been
 * the brief's working default: points avoid the EUR 0,90-versus-EUR 0,14
 * contradiction between Reports 3 and 5 that the handover flags as unresolved.
 *
 * Deterministic by construction - the tip for a day is a function of the day,
 * never of Math.random(), so two runs of the demo show the same history.
 */




/** How many days of history the screen offers. Longer is noise, not evidence. */
const HISTORY_LENGTH = 14;

/**
 * One notification per day, newest first.
 *
 * @param {Array} readings  the report-window readings, oldest first
 * @param {Array} netByDay  net saving in euros per reading, same order
 */
function notificationHistory(readings, netByDay) {
  const tips = rankedTips();

  return readings
    .map((reading, i) => {
      const tip = tips[dayOfYear(reading.date) % tips.length];
      const net = netByDay[i] ?? 0;
      return {
        date: reading.date,
        tipId: tip.id,
        tip,
        // Points follow the day's actual result, so a day that went the wrong
        // way shows nothing gained rather than a cheerful invented number.
        points: Math.max(0, toPoints(net)),
        improved: net > 0,
      };
    })
    .slice(-HISTORY_LENGTH)
    .reverse();
}

/** Short, plain wording for one entry. Never blames a bad day. */
function notificationText(entry, lang) {
  if (entry.improved) {
    return lang === 'en'
      ? 'You used less than expected. ' + entry.points + ' points.'
      : 'Je gebruikte minder dan verwacht. ' + entry.points + ' punten.';
  }
  return lang === 'en'
    ? 'A colder day than the model expected. Nothing is taken away.'
    : 'Een koudere dag dan het model verwachtte. Er gaat niets af.';
}

/**
 * Application state, persisted to localStorage.
 *
 * Consent is granular by design (handover Q10, Report 1): a tenant who refuses
 * an item must still get a working app, so every consent key defaults to false
 * and nothing in the app may treat a refusal as a reason to stop.
 *
 * Storage is deliberately the only persistence layer. The legal gateway
 * (handover Step 1) blocks real data regardless, so a backend would add work
 * without adding truth.
 */


const STORAGE_KEY = 'woneco.state.v1';

/** The data items the consent flow asks about, in the order it asks. */
const CONSENT_ITEMS = Object.freeze([
  Object.freeze({ key: 'meterData', nl: 'Meterstanden (gas en stroom)', en: 'Meter readings (gas and electricity)' }),
  Object.freeze({ key: 'weather', nl: 'Weergegevens', en: 'Weather data' }),
  Object.freeze({ key: 'homeDetails', nl: 'Gegevens over je woning', en: 'Details about your home' }),
  Object.freeze({ key: 'shareAggregated', nl: 'Anoniem meetellen in de buurtcijfers', en: 'Count anonymously in neighbourhood figures' }),
]);

function defaultState() {
  return {
    language: DEFAULT_LANGUAGE,
    onboarded: false,
    // The tour runs once, on first open, over the live app.
    tourDone: false,
    // A default name is assigned rather than demanded at registration: the
    // tree-mascot report is explicit that naming must not be a mandatory step.
    treeName: 'Groenje',
    // 'auto' follows the calendar; a named season lets a presenter show the
    // decoration feature outside its own time of year.
    season: 'auto',
    consent: Object.fromEntries(CONSENT_ITEMS.map((i) => [i.key, false])),
    // Pre-filled, not null: the onboarding screen shows these as the selected
    // options, so a tenant who accepts them without touching the dropdowns
    // must end up with exactly what they were shown. Defaults match the
    // simulated household in js/data/household.js.
    home: { floorAreaM2: 70, occupants: 1 },
    shieldsUsed: 0,

    // Registration and login are mockups. This flag is the ONLY thing they
    // leave behind: no address, no password, nothing that identifies anyone.
    registered: false,
    // Demo device, not a product feature. See js/screens/access.js.
    role: null,

    notifications: true,
    largeText: false,

    // Which simulated household the presenter is showing. Demo device only.
    profile: 'saver',

    // Which slice the Savings screen shows, and which challenges are listed.
    period: 'month',
    challengeFilter: 'active',
  };
}

/** A fresh default state. Never shared - callers may mutate their copy. */
function createState() {
  return defaultState();
}

/**
 * Merges stored values over the defaults, so a state saved by an older
 * version never leaves a key missing.
 */
function hydrate(stored) {
  const base = defaultState();
  if (!stored || typeof stored !== 'object') return base;
  return {
    ...base,
    ...stored,
    consent: { ...base.consent, ...(stored.consent ?? {}) },
    home: { ...base.home, ...(stored.home ?? {}) },
    language: LANGUAGES.includes(stored.language) ? stored.language : base.language,
  };
}

/** True when the tenant has agreed to the item. Unknown items are refused. */
function hasConsent(state, key) {
  return state.consent[key] === true;
}

/**
 * Sets one consent item. Returns a NEW state - never mutates the argument,
 * so a withdrawal is always an explicit, traceable transition.
 */
function setConsent(state, key, granted) {
  if (!(key in state.consent)) throw new Error(`unknown consent item: ${key}`);
  return { ...state, consent: { ...state.consent, [key]: granted === true } };
}

/**
 * The app is usable as long as meter readings are shared - everything else
 * degrades gracefully. Refusing weather makes the expectation less accurate;
 * refusing aggregation only affects the institutional dashboard.
 */
function isUsable(state) {
  return hasConsent(state, 'meterData');
}

/** Reads persisted state. Corrupt storage falls back to defaults, silently. */
function load(storage) {
  try {
    return hydrate(JSON.parse(storage.getItem(STORAGE_KEY)));
  } catch {
    return defaultState();
  }
}

/** Persists state. Returns false if storage is unavailable or full. */
function save(storage, state) {
  try {
    storage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  } catch {
    return false;
  }
}

const SEASON_NAMES = Object.freeze(Object.keys(SEASONS));

/**
 * SVG for a level (1..MAX_STAGE), clamped.
 * opts: { health: 'healthy'|'thirsty'|'wilting', season: keyof SEASONS }
 */
function treeSvg(level, label, opts = {}) {
  const stage = Math.min(MAX_STAGE, Math.max(1, Math.round(level)));
  const health = PALETTES[opts.health] ? opts.health : HEALTHY;
  const palette = PALETTES[health];
  const name = label || LEVELS[stage - 1].nl;

  // Wilting droops the crown. The growth stage itself is untouched.
  let droop = '';
  if (health === WILTING) droop = ' transform="translate(0 3) rotate(-3 60 96)"';
  else if (health === THIRSTY) droop = ' transform="translate(0 1)"';

  // Never decorate a wilting tree - it reads as mockery.
  const decoration = (health === HEALTHY && SEASONS[opts.season]) ? SEASONS[opts.season] : '';

  return '<svg class="tree tree-' + health + '" viewBox="0 0 120 125" role="img" aria-label="'
    + name + '">' + ground + '<g' + droop + '>' + STAGES[stage](palette) + '</g>'
    + decoration + '</svg>';
}

function progressBar(fraction, caption) {

  return `<div class="bar" role="progressbar" aria-valuenow="${pct}"
       aria-valuemin="0" aria-valuemax="100" aria-label="${caption}">

function euro(amount) {
  return formatEuro(amount);

const W = 320;
const H = 150;
const PAD = 6;

/**
 * Actual gas use against the model's expectation, with its uncertainty band.
 *
 * This is where the data-science layer becomes legible: the band is the
 * model's own confidence, not decoration. Where actual sits below the band,
 * the household genuinely used less than the weather explains.
 */
function consumptionChart(readings, expectedSeries, lang) {
  const actual = readings.map((r) => r.gas_m3);
  const mid = expectedSeries.map((e) => e.gas_m3);
  const lo = expectedSeries.map((e) => e.gasBand[0]);
  const hi = expectedSeries.map((e) => e.gasBand[1]);

  const max = Math.max(...hi, ...actual) || 1;
  const x = (i) => PAD + (i * (W - 2 * PAD)) / Math.max(1, actual.length - 1);
  const y = (v) => H - PAD - (v / max) * (H - 2 * PAD);

  const path = (values) => values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const band = `${path(hi)} L${x(lo.length - 1).toFixed(1)} ${y(lo.at(-1)).toFixed(1)} ` +
    lo.map((v, i) => `L${x(lo.length - 1 - i).toFixed(1)} ${y(lo[lo.length - 1 - i]).toFixed(1)}`).join(' ') + ' Z';

  const legend = lang === 'en'
    ? ['What you used', 'What was expected']
    : ['Wat je gebruikte', 'Wat verwacht werd'];

  return `<figure class="chart">
    <svg viewBox="0 0 ${W} ${H}" role="img"
         aria-label="${legend[0]} ${lang === 'en' ? 'versus' : 'tegenover'} ${legend[1]}">
      <path d="${band}" fill="#2E5D3A" opacity=".14"/>
      <path d="${path(mid)}" fill="none" stroke="#2E5D3A" stroke-width="1.5"
            stroke-dasharray="4 3" opacity=".8"/>
      <path d="${path(actual)}" fill="none" stroke="#1F4128" stroke-width="2.2"
            stroke-linejoin="round"/>
    </svg>
    <figcaption class="legend">
      <span class="key solid"></span>${legend[0]}
      <span class="key dashed"></span>${legend[1]}
    </figcaption>
  </figure>`;
}

      <select data-home="occupants">

/** Full markup for one onboarding step. Pure - no DOM access. */
function renderOnboarding(index, state, lang = 'nl') {
  const step = introStep(index);
  const i = INTRO_STEPS.indexOf(step);
  const isLast = i === TOTAL_INTRO_STEPS - 1;

  let controls = '';
  if (step.kind === 'language') controls = languageControls(lang);
  else if (step.kind === 'consent') controls = consentControls(state, lang);
  else if (step.kind === 'meter') controls = meterControls(lang);
  else if (step.kind === 'home') controls = homeControls(state, lang);

  return `<section class="onboarding" data-step="${step.id}" data-index="${i}">
    ${progress(i, lang)}
    <div class="watt">${batterySvg(
      step.kind === 'consent' || step.kind === 'meter' || step.kind === 'home'
        ? 'thinking' : 'happy')}</div>
    <h2>${step[lang].title}</h2>
    <p class="body">${step[lang].body}</p>
    ${controls}
    <div class="actions">
      ${i > 0 ? `<button class="btn ghost" data-action="back">${onboardingLabel('back', lang)}</button>` : ''}
      <button class="btn" data-action="${isLast ? 'finish' : 'next'}">
        ${isLast ? onboardingLabel('start', lang) : onboardingLabel('next', lang)}
      </button>
    </div>
  </section>`;
}

/**
 * Wires the flow into a container.
 * `onFinish(state)` receives the state with consent and home details applied.
 */
function mountOnboarding(container, initialState, lang, onFinish) {
  let index = 0;
  let state = initialState;
  // `lang` may be a function, so the header's NL/EN switch can re-render this
  // step in place. It has to: this is the first screen anyone sees, and until
  // they are through it there is no Profile screen to change the language on.
  const language = () => (typeof lang === 'function' ? lang() : lang);

  function draw() {
    container.innerHTML = renderOnboarding(index, state, language());
  }

  container.addEventListener('change', (event) => {
    const consentKey = event.target.dataset?.consent;
    if (consentKey) state = setConsent(state, consentKey, event.target.checked);

    const homeKey = event.target.dataset?.home;
    if (homeKey) {
      state = { ...state, home: { ...state.home, [homeKey]: Number(event.target.value) } };
    }
  });

  container.addEventListener('click', (event) => {
    const action = event.target.closest('[data-action]')?.dataset.action;
    if (!action) return;
    if (action === 'next') { index = Math.min(TOTAL_INTRO_STEPS - 1, index + 1); draw(); }
    else if (action === 'back') { index = Math.max(0, index - 1); draw(); }
    else if (action === 'connect') { event.target.textContent = language() === 'en' ? 'Connected' : 'Gekoppeld'; }
    else if (action === 'finish') { onFinish({ ...state, onboarded: true }); }
  });

  draw();
  return { draw };
}

/**
 * Runs registration or login, then the role selector, then hands over.
 *
 * @param {HTMLElement} container
 * @param {object} opts { store, onDone() }
 */
function mountAccess(container, opts) {
  const { store, onDone } = opts;
  const lang = () => store.get().language;

  // Whatever is on screen, so the header's NL/EN switch can re-render it. None
  // of these screens has a drawer, so this is the only way to change language
  // before registration is finished.
  let redraw = () => {};

  function showRoles() {
    redraw = () => { container.innerHTML = renderRoles(lang()); };
    redraw();
  }

  function showCredentials() {
    const mode = store.get().registered ? 'login' : 'register';
    redraw = () => { container.innerHTML = renderCredentials(mode, lang()); };
    redraw();
  }

  function showConsentJourney() {
    // The consent journey is the seven-step flow Watt already owns. The brief
    // puts it inside registration rather than in front of the whole app.
    // mountOnboarding is called once - re-running it would stack listeners, so
    // the language switch goes through its own draw().
    const view = mountOnboarding(container, store.get(), lang, (next) => {
      // Merge only what the journey owns. It captured the state at mount time,
      // so writing the whole object back would undo anything changed since -
      // including the language picked on its own first step.
      store.set({
        ...store.get(),
        consent: next.consent,
        home: next.home,
        onboarded: true,
      });
      showCredentials();
    });
    redraw = view.draw;
  }

  container.addEventListener('click', (event) => {
    // The first onboarding step asks which language before anything is
    // explained. mountOnboarding does not own the store, so the choice is
    // applied here and redrawn through it.
    const chosen = event.target.closest('[data-lang]')?.dataset.lang;
    if (chosen) {
      if (chosen !== lang()) store.set({ ...store.get(), language: chosen });
      return;
    }

    const action = event.target.closest('[data-access-action]')?.dataset.accessAction;

    if (action === 'submit') {
      // The password is deliberately never read back out of the field.
      store.set({ ...store.get(), registered: true });
      showRoles();
      return;
    }
    if (action === 'skip' || action === 'roles') { showRoles(); return; }

    const role = event.target.closest('[data-role]')?.dataset.role;
    if (!role) return;
    store.set({ ...store.get(), role });
    if (role === 'tenant') { onDone(); return; }
    redraw = () => { container.innerHTML = renderInstitutionalRole(roleById(role), lang()); };
    redraw();
  });

  if (store.get().registered) showCredentials();
  else showConsentJourney();

  return { redraw: () => redraw() };
}

/**

 *
 * The demonstrator brief lists "Goals" as a drawer entry (Report 5's levels
 * and rewards overview) and it was the last one missing. It also answers the
 * obvious question the home screen raises and never resolves - what does the
 * tree actually turn into? - which no single-stage mascot can show.
 *
 * Reached stages are drawn in full colour, the rest greyed but still visible:
 * hiding them would remove the thing the whole ladder is for.
 *
 * Pure function of (app, state, lang), like every other screen.
 */





function renderLevels(app, state, lang) {
  const reachedLevel = app.stage.level;

  const rungs = LEVELS.map((rung) => {
    const reached = rung.level <= reachedLevel;
    const current = rung.level === reachedLevel;
    const name = rung[lang] || rung.nl;

    const status = current
      ? say('Hier sta je nu', 'You are here now', lang)
      : reached
        ? say('Gehaald', 'Reached', lang)
        : say('Vanaf ' + euro(rung.threshold), 'From ' + euro(rung.threshold), lang);

    return '<li class="rung' + (reached ? ' reached' : '') + (current ? ' current' : '') + '"'
      + ' data-level="' + rung.level + '">'
      + treeSvg(rung.level, name, { health: 'healthy' })
      + '<div class="rung-text">'
      + '<strong>' + rung.level + '. ' + name + '</strong>'
      + '<span class="rung-status">' + status + '</span>'
      + '</div></li>';
  }).join('');

  // Each rung costs more than the one before it, which is the point: the first
  // stage should arrive quickly and the last should feel earned.
  const gaps = LEVELS.slice(1).map((rung, i) =>
    Math.round((rung.threshold - LEVELS[i].threshold) * 100) / 100);

  return '<h2>' + say('Je boom', 'Your tree', lang) + '</h2>'
    + '<p class="note">' + say(
      'Zes stappen. Elke stap kost meer dan de vorige, dus de eerste gaat snel en de laatste voelt verdiend.',

          'Je boom zakt nooit terug. Een slechte week laat hem hangen, maar je raakt een stap nooit kwijt.',

  // Euro stays visually dominant (Report 6's survey: 69.6% preferred euros);

    + formatNumber(units.gas_m3, 0) + ' m3 ' + say('minder', 'less', lang) + '</p>';

  // Tip copy is points-denominated, not euro. Confirmed 2026-08-10: points

  const tipCard = '<button class="tip-card" data-open="tips">'
    + '<span class="tip-kicker">' + say('Tip van vandaag', 'Today’s tip', lang) + '</span>'

    + '<span class="tip-points">+' + toPoints(topTip.euroPerYear / 365) + ' '

    ? progressBar(progress.fraction, say(

  return treeSvg(stage.level, stageName, { health: health.state, season: app.season })
    + '<p class="tree-name">' + state.treeName + '</p>'
    + '<p class="figure">' + euro(cumulative) + '</p>'
    + physical
    // Tappable: the home screen shows one stage of the tree and never answers

    + '<p><button class="stage" data-open="levels">' + say('Niveau', 'Level', lang) + ' ' + stage.level
    + ' &middot; ' + stageName + ' &rsaquo;</button></p>'
